openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Operational overview and activity
  - name: auth
    description: Authenticated identity and access scope
  - name: tasks
    description: Task management and evidence
  - name: stores
    description: Store directory and administration
  - name: team
    description: Managers and supervisors
  - name: rankings
    description: Performance rankings
paths:
  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the authenticated member and server-authorized scope
      responses:
        "200":
          description: Authenticated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentMember"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: getActivity
      tags: [dashboard]
      summary: Get recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /notifications/public-key:
    get:
      operationId: getPushPublicKey
      tags: [notifications]
      summary: Get the public key used to subscribe to Web Push
      responses:
        "200":
          description: Web Push public key
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey:
                    type: string
  /notifications/subscription:
    post:
      operationId: savePushSubscription
      tags: [notifications]
      summary: Save the authenticated user's Web Push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "204":
          description: Subscription saved
    delete:
      operationId: deletePushSubscription
      tags: [notifications]
      summary: Remove the authenticated user's Web Push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionDeleteInput"
      responses:
        "204":
          description: Subscription removed
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List operational tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: storeId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          description: Include tasks scheduled on or after this date
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Include tasks scheduled on or before this date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create an operational task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteAllTasks
      tags: [tasks]
      summary: Permanently delete tasks created by the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteTasksInput"
      responses:
        "204":
          description: Selected tasks and their evidence permanently deleted
        "403":
          description: The user can delete only tasks they created
  /tasks/summary:
    get:
      operationId: listTaskSummaries
      tags: [tasks]
      summary: List lightweight task summaries for operational screens
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: storeId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          description: Include tasks scheduled on or after this date
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Include tasks scheduled on or before this date
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Lightweight task summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskSummary"
  /tasks/notifications:
    get:
      operationId: listTaskNotifications
      tags: [tasks]
      summary: List the minimum task fields needed for notifications
      responses:
        "200":
          description: Notification task metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskNotification"
  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get one task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Permanently delete an operational task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Task and its evidence permanently deleted
        "403":
          description: The user can delete only a task they created
  /tasks/{id}/evidence/pdf:
    get:
      operationId: downloadTaskEvidencePdf
      tags: [tasks]
      summary: Download a PDF presentation of photo evidence for the task and its store copies
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - name: scope
          in: query
          description: Export all authorized store copies or only this completed store task
          schema:
            type: string
            enum: [task, store]
            default: task
      responses:
        "200":
          description: PDF containing up to four resized evidence photos per page, each identified by store
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Task is outside the user's authorized stores or no photos were found
        "400":
          description: Invalid PDF scope
        "409":
          description: Store-only PDF is available after the store task is completed
        "500":
          description: A photo could not be loaded or converted; no incomplete PDF is returned
  /tasks/{id}/evidence:
    post:
      operationId: addTaskEvidence
      tags: [tasks]
      summary: Add evidence to a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Evidence registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
  /tasks/{id}/evidence/{evidenceId}:
    delete:
      operationId: deleteTaskEvidence
      tags: [tasks]
      summary: Delete evidence before a task is finalized
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Evidence deleted
        "403":
          description: User cannot edit this task
        "404":
          description: Task or evidence not found
        "409":
          description: Evidence cannot be deleted after task finalization
  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Complete a task when required evidence exists
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Required evidence missing
  /tasks/{id}/review:
    post:
      operationId: reviewTask
      tags: [tasks]
      summary: Approve or reject a supervisor-created task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReviewInput"
      responses:
        "200":
          description: Task reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}/comments:
    post:
      operationId: addTaskComment
      tags: [tasks]
      summary: Add a comment to a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCommentInput"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskComment"
  /tasks/bulk:
    post:
      operationId: createBulkTasks
      tags: [tasks]
      summary: Create one independent task for each selected store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTaskInput"
      responses:
        "201":
          description: Tasks created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
  /tasks/recurring:
    post:
      operationId: createRecurringTasks
      tags: [tasks]
      summary: Schedule independent recurring task occurrences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTaskInput"
      responses:
        "201":
          description: Task occurrences created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
  /stores:
    get:
      operationId: listStores
      tags: [stores]
      summary: List stores
      responses:
        "200":
          description: Stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
    post:
      operationId: createStore
      tags: [stores]
      summary: Create a store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "201":
          description: Store created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
  /stores/{id}:
    patch:
      operationId: updateStore
      tags: [stores]
      summary: Update a store
      parameters:
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdate"
      responses:
        "200":
          description: Store updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
    delete:
      operationId: deleteStore
      tags: [stores]
      summary: Delete a store
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "204":
          description: Store deleted
  /team-members:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List managers and supervisors
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [manager, supervisor]
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: createTeamMember
      tags: [team]
      summary: Create a manager or supervisor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Team member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
  /team-members/{id}:
    patch:
      operationId: updateTeamMember
      tags: [team]
      summary: Update a manager or supervisor
      parameters:
        - $ref: "#/components/parameters/TeamMemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Team member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
    delete:
      operationId: deleteTeamMember
      tags: [team]
      summary: Deactivate a manager or supervisor
      parameters:
        - $ref: "#/components/parameters/TeamMemberId"
      responses:
        "204":
          description: Team member deactivated
  /team-members/{id}/permanent:
    delete:
      operationId: permanentlyDeleteTeamMember
      tags: [team]
      summary: Permanently delete a manager or supervisor without task history
      parameters:
        - $ref: "#/components/parameters/TeamMemberId"
      responses:
        "204":
          description: Team member permanently deleted
        "409":
          description: Team member has operational history and cannot be deleted
  /rankings:
    get:
      operationId: getRankings
      tags: [rankings]
      summary: Get store performance rankings
      parameters:
        - in: query
          name: fromDate
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: toDate
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: region
          required: false
          schema:
            type: string
            minLength: 1
        - in: query
          name: supervisor
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Rankings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankingEntry"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [tasks]
      summary: Request a private evidence upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlInput"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    StoreId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TeamMemberId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Store:
      type: object
      required: [id, name, city, region, manager, supervisor, execution]
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type: string
        region:
          type: string
        manager:
          type: string
        managerMemberId:
          type: string
          nullable: true
        supervisor:
          type: string
        supervisorMemberId:
          type: string
          nullable: true
        execution:
          type: integer
          minimum: 0
          maximum: 100
    StoreInput:
      type: object
      required: [name, city, region]
      properties:
        name:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        region:
          type: string
          minLength: 1
        manager:
          type: string
        supervisor:
          type: string
    StoreUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        region:
          type: string
          minLength: 1
        manager:
          type: string
        supervisor:
          type: string
    TeamMember:
      type: object
      required: [id, name, email, phone, role, storeId, active, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [manager, supervisor, admin]
        storeId:
          type: ["string", "null"]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CurrentMember:
      type: object
      required: [id, name, email, role, storeIds]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [manager, supervisor, admin]
        storeIds:
          type: array
          items:
            type: string
    TeamMemberInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [manager, supervisor, admin]
        storeId:
          type: ["string", "null"]
    TeamMemberUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [manager, supervisor, admin]
        storeId:
          type: ["string", "null"]
        active:
          type: boolean
    Evidence:
      type: object
      required: [id, taskId, type, fileName, objectPath, createdAt, userName, isHistorical]
      properties:
        id:
          type: string
        taskId:
          type: string
        type:
          type: string
          enum: [photo, video]
        fileName:
          type: string
        objectPath:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        userName:
          type: string
        location:
          type: ["string", "null"]
        isHistorical:
          type: boolean
    EvidenceInput:
      type: object
      required: [type, fileName, objectPath]
      properties:
        type:
          type: string
          enum: [photo, video]
        fileName:
          type: string
          minLength: 1
        objectPath:
          type: string
          minLength: 10
        location:
          type: string
    TaskModelAttachment:
      type: object
      required: [objectPath, fileName, type]
      properties:
        objectPath:
          type: string
        fileName:
          type: string
        type:
          type: string
          enum: [photo, video]
    TaskComment:
      type: object
      required: [id, taskId, userId, message, type, createdAt, userName]
      properties:
        id:
          type: string
        taskId:
          type: string
        userId:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [manager_note, supervisor_note, supervisor_rejection, admin_note]
        createdAt:
          type: string
          format: date-time
        userName:
          type: string
    TaskCommentInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
    TaskReviewInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
    Task:
      type: object
      required: [id, title, description, storeId, storeName, assignee, category, priority, dueDate, dueTime, createdAt, status, evidenceRequired, evidence, comments, instructions, createdByRole, createdByMemberId]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        storeId:
          type: string
        storeName:
          type: string
        assignee:
          type: string
        assigneeMemberId:
          type: ["string", "null"]
        assigneeMemberIds:
          type: array
          items:
            type: string
        assigneeRole:
          type: string
          enum: [manager, supervisor]
        batchGroupId:
          type: ["string", "null"]
        category:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date
        dueTime:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, in_progress, pending_review, rejected, completed, overdue]
        evidenceRequired:
          type: boolean
        evidenceTypes:
          type: array
          items:
            type: string
            enum: [photo, video]
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        modelObjectPath:
          type: ["string", "null"]
        modelAttachments:
          type: array
          items:
            $ref: "#/components/schemas/TaskModelAttachment"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/TaskComment"
        createdByRole:
          type: string
          enum: [manager, supervisor, admin]
        createdByName:
          type: string
        createdByMemberId:
          type: ["string", "null"]
        instructions:
          type: string
        completedAt:
          type: ["string", "null"]
        completedBy:
          type: ["string", "null"]
    TaskSummary:
      type: object
      required: [id, title, storeId, storeName, assignee, assigneeMemberIds, assigneeRole, category, priority, dueDate, dueTime, createdAt, status, batchGroupId, createdByRole, createdByName, createdByMemberId]
      properties:
        id:
          type: string
        title:
          type: string
        storeId:
          type: string
        storeName:
          type: string
        assignee:
          type: string
        assigneeMemberId:
          type: ["string", "null"]
        assigneeMemberIds:
          type: array
          items:
            type: string
        assigneeRole:
          type: string
          enum: [manager, supervisor]
        batchGroupId:
          type: ["string", "null"]
        category:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date
        dueTime:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, in_progress, pending_review, rejected, completed, overdue]
        createdByRole:
          type: string
          enum: [manager, supervisor, admin]
        createdByName:
          type: string
        createdByMemberId:
          type: ["string", "null"]
    TaskNotification:
      type: object
      required: [id, createdAt, assigneeMemberIds]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        assigneeMemberId:
          type: ["string", "null"]
        assigneeMemberIds:
          type: array
          items:
            type: string
    TaskInput:
      type: object
      required: [title, description, storeId, storeName, assignee, category, priority, dueDate, dueTime, evidenceRequired, instructions]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        storeId:
          type: string
        storeName:
          type: string
        assignee:
          type: string
        assigneeMemberIds:
          type: array
          items:
            type: string
        assigneeRole:
          type: string
          enum: [manager, supervisor]
        category:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date
        dueTime:
          type: string
        evidenceRequired:
          type: boolean
        evidenceTypes:
          type: array
          items:
            type: string
            enum: [photo, video]
        modelObjectPath:
          type: ["string", "null"]
        modelAttachments:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TaskModelAttachment"
        instructions:
          type: string
    BulkTaskInput:
      type: object
      required: [title, description, storeIds, assigneeRole, category, priority, dueDate, dueTime, evidenceRequired, instructions]
      properties:
        title:
          type: string
          minLength: 1
        description:
