openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Operational overview and activity
  - name: auth
    description: Authenticated identity and access scope
  - name: tasks
    description: Task management and evidence
  - name: stores
    description: Store directory and administration
  - name: team
    description: Managers and supervisors
  - name: rankings
    description: Performance rankings
paths:
  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the authenticated member and server-authorized scope
      responses:
        "200":
          description: Authenticated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentMember"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: getActivity
      tags: [dashboard]
      summary: Get recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List operational tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: storeId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create an operational task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get one task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{id}/evidence:
    post:
      operationId: addTaskEvidence
      tags: [tasks]
      summary: Add evidence to a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Evidence registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Complete a task when required evidence exists
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Required evidence missing
  /tasks/bulk:
    post:
      operationId: createBulkTasks
      tags: [tasks]
      summary: Create one independent task for each selected store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTaskInput"
      responses:
        "201":
          description: Tasks created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
  /tasks/recurring:
    post:
      operationId: createRecurringTasks
      tags: [tasks]
      summary: Schedule independent recurring task occurrences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTaskInput"
      responses:
        "201":
          description: Task occurrences created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
  /stores:
    get:
      operationId: listStores
      tags: [stores]
      summary: List stores
      responses:
        "200":
          description: Stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
    post:
      operationId: createStore
      tags: [stores]
      summary: Create a store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "201":
          description: Store created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
  /stores/{id}:
    patch:
      operationId: updateStore
      tags: [stores]
      summary: Update a store
      parameters:
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdate"
      responses:
        "200":
          description: Store updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
    delete:
      operationId: deleteStore
      tags: [stores]
      summary: Delete a store
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "204":
          description: Store deleted
  /team-members:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List managers and supervisors
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [manager, supervisor]
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: createTeamMember
      tags: [team]
      summary: Create a manager or supervisor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Team member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
  /team-members/{id}:
    patch:
      operationId: updateTeamMember
      tags: [team]
      summary: Update a manager or supervisor
      parameters:
        - $ref: "#/components/parameters/TeamMemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Team member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
    delete:
      operationId: deleteTeamMember
      tags: [team]
      summary: Deactivate a manager or supervisor
      parameters:
        - $ref: "#/components/parameters/TeamMemberId"
      responses:
        "204":
          description: Team member deactivated
  /rankings:
    get:
      operationId: getRankings
      tags: [rankings]
      summary: Get store performance rankings
      responses:
        "200":
          description: Rankings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankingEntry"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [tasks]
      summary: Request a private evidence upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlInput"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    StoreId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TeamMemberId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Store:
      type: object
      required: [id, name, city, region, manager, supervisor, execution]
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type: string
        region:
          type: string
        manager:
          type: string
        supervisor:
          type: string
        execution:
          type: integer
          minimum: 0
          maximum: 100
    StoreInput:
      type: object
      required: [name, city, region]
      properties:
        name:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        region:
          type: string
          minLength: 1
        manager:
          type: string
        supervisor:
          type: string
    StoreUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        region:
          type: string
          minLength: 1
        manager:
          type: string
        supervisor:
          type: string
    TeamMember:
      type: object
      required: [id, name, email, phone, role, storeId, active, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [manager, supervisor, admin]
        storeId:
          type: ["string", "null"]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CurrentMember:
      type: object
      required: [id, name, email, role, storeIds]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [manager, supervisor, admin]
        storeIds:
          type: array
          items:
            type: string
    TeamMemberInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [manager, supervisor]
        storeId:
          type: ["string", "null"]
    TeamMemberUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [manager, supervisor]
        storeId:
          type: ["string", "null"]
        active:
          type: boolean
    Evidence:
      type: object
      required: [id, taskId, type, fileName, objectPath, createdAt, userName]
      properties:
        id:
          type: string
        taskId:
          type: string
        type:
          type: string
          enum: [photo, video]
        fileName:
          type: string
        objectPath:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        userName:
          type: string
        location:
          type: ["string", "null"]
    EvidenceInput:
      type: object
      required: [type, fileName, objectPath]
      properties:
        type:
          type: string
          enum: [photo, video]
        fileName:
          type: string
          minLength: 1
        objectPath:
          type: string
          minLength: 10
        location:
          type: string
    Task:
      type: object
      required: [id, title, description, storeId, storeName, assignee, category, priority, dueDate, dueTime, status, evidenceRequired, evidence, instructions]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        storeId:
          type: string
        storeName:
          type: string
        assignee:
          type: string
        assigneeMemberId:
          type: ["string", "null"]
        assigneeRole:
          type: string
          enum: [manager, supervisor]
        batchGroupId:
          type: ["string", "null"]
        category:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date
        dueTime:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, overdue]
        evidenceRequired:
          type: boolean
        evidenceTypes:
          type: array
          items:
            type: string
            enum: [photo, video]
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        instructions:
          type: string
        completedAt:
          type: ["string", "null"]
        completedBy:
          type: ["string", "null"]
    TaskInput:
      type: object
      required: [title, description, storeId, storeName, assignee, category, priority, dueDate, dueTime, evidenceRequired, instructions]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        storeId:
          type: string
        storeName:
          type: string
        assignee:
          type: string
        assigneeRole:
          type: string
          enum: [manager, supervisor]
        category:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date
        dueTime:
          type: string
        evidenceRequired:
          type: boolean
        evidenceTypes:
          type: array
          items:
            type: string
            enum: [photo, video]
        instructions:
          type: string
    BulkTaskInput:
      type: object
      required: [title, description, storeIds, assigneeRole, category, priority, dueDate, dueTime, evidenceRequired, instructions]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        storeIds:
          type: array
          minItems: 1
          items:
            type: string
        assignee:
          type: string
        assigneeRole:
          type: string
          enum: [manager, supervisor]
        category:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date
        dueTime:
          type: string
        evidenceRequired:
          type: boolean
        evidenceTypes:
          type: array
          items:
            type: string
            enum: [photo, video]
        instructions:
          type: string
    RecurringTaskInput:
      type: object
      required: [title, description, storeIds, assigneeRole, category, priority, dueDate, dueTime, evidenceRequired, instructions, recurrenceMode]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        storeIds:
          type: array
          minItems: 1
          items:
            type: string
        assignee:
          type: string
        assigneeRole:
          type: string
          enum: [manager, supervisor]
        category:
          type: string
        priority:
          type: string
          enum: [low, medium, high]
        dueDate:
          type: string
          format: date
        dueTime:
          type: string
        evidenceRequired:
          type: boolean
        evidenceTypes:
          type: array
          items:
            type: string
            enum: [photo, video]
        instructions:
          type: string
        recurrenceMode:
          type: string
          enum: [daily_count, weekdays_until]
        occurrenceCount:
          type: integer
          minimum: 1
          maximum: 365
        weekdays:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 6
        endDate:
          type: string
          format: date
    TaskUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, in_progress, completed, overdue]
        priority:
          type: string
          enum: [low, medium, high]
        notes:
          type: string
    Activity:
      type: object
      required: [id, title, detail, createdAt, tone]
      properties:
        id:
          type: string
        title:
          type: string
        detail:
          type: string
        createdAt:
          type: string
          format: date-time
        tone:
          type: string
          enum: [success, warning, info]
    DashboardSummary:
      type: object
      required: [role, storeName, tasksToday, completed, pending, overdue, execution, storesCount, campaignsActive, actionPlans]
      properties:
        role:
          type: string
          enum: [manager, supervisor, admin]
        storeName:
          type: string
        tasksToday:
          type: integer
        completed:
          type: integer
        pending:
          type: integer
        overdue:
          type: integer
        execution:
          type: integer
        storesCount:
          type: integer
        campaignsActive:
          type: integer
        actionPlans:
          type: integer
    RankingEntry:
      type: object
      required: [position, storeName, manager, execution, trend]
      properties:
        position:
          type: integer
        storeName:
          type: string
        manager:
          type: string
        execution:
          type: integer
        trend:
          type: string
          enum: [up, down, stable]
    UploadUrlInput:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          type: object
          required: [name, size, contentType]
          properties:
            name:
              type: string
            size:
              type: integer
            contentType:
              type: string

