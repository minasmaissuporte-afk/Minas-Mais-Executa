<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#d92525" />
    <title>Sem conexão — Minas Mais Executa</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f4f3; color: #242424; font-family: Inter, system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #dededb; border-radius: 18px; background: white; box-shadow: 0 18px 48px rgba(0,0,0,.08); text-align: center; }
      .mark { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 16px; background: #d92525; color: white; font-size: 25px; font-weight: 800; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0 0 22px; color: #666; line-height: 1.55; }
      button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: #d92525; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">M</div>
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para consultar e atualizar as tarefas da operação.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
